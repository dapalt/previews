<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utwórz wydarzenie</title><link rel="stylesheet" href="style.css?v=ebf06b066067"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; form-action 'none'; base-uri 'none'"></head>
<body><div class="app no-budget">

<main class="page no-nav"><p class="notice small preview-notice"><a href="index.html?v=ebf06b066067">Podgląd</a> · Fikcyjne dane. Próbne zmiany zostają w tej przeglądarce. Nie wpisuj prawdziwych danych.</p><a class="back" href="screen-9.html?v=ebf06b066067"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"></path></svg>Wróć</a><h1>Utwórz wydarzenie</h1>
<div class="form"><div><label for="name">Nazwa wydarzenia</label><input id="name" name="name" value="" required="" maxlength="100" autocomplete="off"></div><div><label for="roster">Lista osób — co najmniej trzy, po jednym imieniu w wierszu</label><textarea id="roster" name="roster" required="" maxlength="4000" autocomplete="off"></textarea></div><fieldset class="form-group"><legend>Budżet całego prezentu</legend><label for="budgetType">Rodzaj budżetu</label>
<select id="budgetType" name="budgetType" autocomplete="off"><option value="none" selected="">Bez limitu</option><option value="max">Maksymalnie</option><option value="range">Zakres</option></select>
<div class="budget-fields"><div><label for="min">Od (zł)</label><input id="min" name="min" value="" type="number" min="1" max="100000" autocomplete="off"></div><div><label for="max">Do (zł)</label><input id="max" name="max" value="" type="number" min="1" max="100000" autocomplete="off"></div></div></fieldset><div><label for="greeting">Powitanie</label><input id="greeting" name="greeting" value="" maxlength="200" autocomplete="off"></div><div class="stack"><div><label for="date">Data</label><input id="date" name="date" value="" type="date" aria-describedby="meeting-format" autocomplete="off"></div><div><label for="time">Godzina</label><input id="time" name="time" value="" type="time" aria-describedby="meeting-format" autocomplete="off"></div>
<p id="meeting-format" class="small">Pola używają formatu Twojej przeglądarki.</p>
<output data-meeting-preview="" class="small" for="date time" hidden="">Uczestnicy zobaczą: <strong></strong></output></div><div><label for="place">Miejsce</label><input id="place" name="place" value="" maxlength="200" autocomplete="off"></div><div><label for="message">Wiadomość dla uczestników</label><textarea id="message" name="message" maxlength="3000" autocomplete="off"></textarea></div><p class="small">Budżet pojawi się w wiadomości automatycznie.</p><label class="checkbox-row"><input type="checkbox" name="foodEnabled" value="yes" autocomplete="off"><span>Włącz zakładkę „Jedzenie” dla uczestników</span></label><button class="btn " type="button" disabled="">Utwórz wydarzenie</button></div></main>

</div></body></html>
